name: verify-data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the CSVs (fails on problems not in the baseline)
        run: python3 scripts/validate_csv.py
      - name: Check the Zanzibar CSVs match their source
        run: python3 scripts/build_zanzibar.py --check
      - name: Validate the NBS 2022 sources and the crosswalk
        run: python3 scripts/validate_sources.py
      - name: Check the crosswalk is what the script builds
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet rapidfuzz==3.14.6
          "$RUNNER_TEMP/venv/bin/python" -I scripts/build_crosswalk.py --check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d setup.sh # v0.11.0
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile # v2.15.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12
      - name: zizmor (workflow security)
        run: pipx run zizmor==1.31.1 --offline .github/workflows

  import:
    needs: validate-data
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start the database
        run: |
          cp .env.example .env
          docker compose up -d --build db

      - name: Wait for the import to finish
        run: |
          for _ in $(seq 1 180); do
            if docker compose logs db 2>&1 | grep -q "MySQL init process done"; then
              until docker compose exec -T db mysqladmin ping -uroot -pchange-me-root --silent; do sleep 2; done
              exit 0
            fi
            sleep 5
          done
          docker compose logs db | tail -50
          exit 1

      - name: Check row counts
        run: |
          q() { docker compose exec -T db mysql -uroot -pchange-me-root locations -N -e "$1" 2>/dev/null; }
          fail=0
          check() {
            got=$(q "SELECT COUNT(*) FROM $1;")
            if [ "$got" = "$2" ]; then echo "ok   $1 = $got"; else echo "FAIL $1 = $got, expected $2"; fail=1; fi
          }
          # Mainland (26 regions) plus Zanzibar (5 regions, codes 71 to 75). See the README for the changes.
          check countries 252
          check regions 31
          check districts 169
          check wards 4061
          check general 68775
          check places 75326
          check sources 5
          check nbs_regions 31
          check nbs_councils 195
          check nbs_wards 4344
          check crosswalk_regions 31
          check crosswalk_districts 200
          check crosswalk_wards 4190
          exit $fail

  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t tanzania-locations:ci .
      - name: Trivy scan (fails on fixable CRITICAL vulnerabilities)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             -v "$PWD/.trivyignore:/work/.trivyignore:ro"             aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c             image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress             --ignorefile /work/.trivyignore tanzania-locations:ci # 0.76.1
